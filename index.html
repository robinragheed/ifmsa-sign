<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>IFMSA-Kurdistan Receipt</title>
  <link rel="icon" href="https://ifmsakurdistan.org/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Colours and font taken from ifmsakurdistan.org */
    :root {
      --navy: #111f74; --navy-dark: #071140; --sky: #669be1; --bg: #f5f7fc;
      --text: #071140; --muted: #5b6488; --line: rgba(17, 31, 116, .10); --red: #c62828;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Montserrat, "Noto Sans Arabic", system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

    .topbar { background: var(--navy); display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
    .topbar img { width: 38px; height: 38px; }
    .topbar span { color: #fff; font-weight: 700; font-size: 17px; line-height: 1.1; }
    .hero { background: linear-gradient(180deg, var(--navy) 0%, var(--navy) 70%, #2a3a8f 100%); color: #fff; padding: 26px 20px 74px; }
    .hero-inner { max-width: 520px; margin: 0 auto; }
    .hero .eyebrow { display: inline-block; background: rgba(102,155,225,.2); color: var(--sky); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 6px 12px; border-radius: 10px; }
    .hero h1 { margin: 12px 0 6px; font-size: 28px; font-weight: 700; line-height: 1.15; }
    .hero p { margin: 0; font-size: 14px; color: rgba(255,255,255,.8); line-height: 1.5; }

    main { max-width: 520px; margin: -52px auto 0; padding: 0 16px 24px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(17,31,116,.08); margin-bottom: 14px; }
    h2 { font-size: 17px; font-weight: 700; margin: 0 0 10px; color: var(--navy); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .row:last-child { border-bottom: 0; }
    .row .label { color: var(--muted); }
    .row .value { font-weight: 600; text-align: right; }
    .row .value.amount { font-size: 20px; font-weight: 700; color: var(--navy); }
    label.confirm { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.45; }
    label.confirm input { width: 24px; height: 24px; flex: none; margin: 0; accent-color: var(--navy); }
    .pad-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .pad-wrap { position: relative; border: 2px dashed rgba(102,155,225,.6); border-radius: 12px; background: #fbfcff; }
    canvas { display: block; width: 100%; height: 210px; touch-action: none; border-radius: 12px; }
    .pad-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa3c4; pointer-events: none; font-size: 15px; }
    .btn { display: block; width: 100%; padding: 15px; border: 0; border-radius: 10px; font-family: inherit; font-size: 16px; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; }
    .btn-primary { background: var(--navy); color: #fff; box-shadow: 0 6px 18px rgba(17,31,116,.25); }
    .btn-primary:disabled { background: #8a93bf; box-shadow: none; }
    .btn-clear { background: rgba(102,155,225,.15); border: 0; border-radius: 10px; color: var(--navy); font-family: inherit; font-weight: 600; font-size: 14px; padding: 6px 12px; cursor: pointer; }
    .error { color: var(--red); font-size: 14px; min-height: 20px; margin: 4px 2px 10px; }
    .muted { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .center { text-align: center; }
    .big-icon { font-size: 52px; text-align: center; margin: 4px 0 8px; }
    footer { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 16px 28px; }
    footer a { color: var(--navy); font-weight: 600; text-decoration: none; }
  </style>
</head>

  <script>
    // On Google's own page the server fills this in. On the hosted page it is null and loaded at the bottom.
    let DATA = null;
    const app = document.getElementById('app');

    // ---- tiny DOM helpers ----
    function el(tag, props, ...kids) {
      const n = document.createElement(tag);
      Object.assign(n, props || {});
      kids.flat().forEach(k => { if (k != null && k !== '') n.append(k); });
      return n;
    }
    const card = (...kids) => el('div', { className: 'card' }, ...kids);
    const row = (label, value, cls) => el('div', { className: 'row' },
      el('span', { className: 'label', textContent: label }),
      el('span', { className: 'value ' + (cls || ''), textContent: value || '' }));
    const subtitle = t => { document.getElementById('subtitle').textContent = t || ''; };
    const show = (...nodes) => { app.replaceChildren(...nodes); window.scrollTo(0, 0); };

    // ---- signature pad ----
    function makePad() {
      const canvas = el('canvas');
      const hint = el('div', { className: 'pad-hint', textContent: '✍️ Sign here with your finger' });
      const node = el('div', { className: 'pad-wrap' }, canvas, hint);
      let ctx, drawing = false, last = null, empty = true;

      function reset() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx = canvas.getContext('2d');
        ctx.scale(ratio, ratio);
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = ctx.fillStyle = '#0d1b4c';
        empty = true;
        hint.style.display = '';
      }
      function pos(e) {
        const r = canvas.getBoundingClientRect();
        return { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      canvas.addEventListener('pointerdown', e => {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        drawing = true;
        last = pos(e);
        ctx.beginPath();
        ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        if (empty) { empty = false; hint.style.display = 'none'; }
      });
      canvas.addEventListener('pointermove', e => {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        last = p;
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, () => { drawing = false; }));
      window.addEventListener('resize', () => { if (empty) reset(); });

      // Crops to the drawn area and shrinks to at most 600px wide.
      function toDataURL() {
        const W = canvas.width, H = canvas.height;
        const px = canvas.getContext('2d').getImageData(0, 0, W, H).data;
        let minX = W, minY = H, maxX = -1, maxY = -1;
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            if (px[(y * W + x) * 4 + 3] > 0) {
              if (x < minX) minX = x; if (x > maxX) maxX = x;
              if (y < minY) minY = y; if (y > maxY) maxY = y;
            }
          }
        }
        if (maxX < 0) return null;
        const pad = 12;
        minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
        maxX = Math.min(W - 1, maxX + pad); maxY = Math.min(H - 1, maxY + pad);
        const cw = maxX - minX + 1, ch = maxY - minY + 1;
        const scale = Math.min(1, 600 / cw);
        const out = document.createElement('canvas');
        out.width = Math.max(1, Math.round(cw * scale));
        out.height = Math.max(1, Math.round(ch * scale));
        out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, out.width, out.height);
        return out.toDataURL('image/png');
      }

      return { node, reset, isEmpty: () => empty, toDataURL };
    }

    function padCard(pad, title) {
      return card(
        el('div', { className: 'pad-head' },
          el('strong', { textContent: title }),
          el('button', { className: 'btn-clear', textContent: 'Clear', onclick: () => pad.reset() })),
        pad.node);
    }

    // ---- pages ----
    function renderMessage(title, text) {
      subtitle(title);
      show(card(el('p', { className: 'muted', style: 'margin:0;font-size:15px', textContent: text })));
    }

    function renderDone(receiptUrl) {
      subtitle('Membership Fee Receipt');
      show(card(
        el('div', { className: 'big-icon', textContent: '✅' }),
        el('h2', { className: 'center', textContent: 'Thank you' + (DATA.name ? ', ' + DATA.name : '') + '!' }),
        el('p', { className: 'muted center', textContent: 'Your receipt is ready. If you gave an email address, a copy was sent there too.' }),
        receiptUrl ? el('a', { className: 'btn btn-primary', href: receiptUrl, target: '_blank', textContent: '📄 Open my receipt' }) : null
      ));
    }

    function renderMember() {
      subtitle('Membership Fee Receipt');
      const pad = makePad();
      const agree = el('input', { type: 'checkbox' });
      const err = el('div', { className: 'error' });
      const btn = el('button', { className: 'btn btn-primary', textContent: 'Sign & get my receipt' });
      const exempt = DATA.type === 'Exempted Member';   // pays nothing, so "paid" wording would be wrong

      show(
        card(
          el('h2', { textContent: 'Please check your details' }),
          row('Name', DATA.name),
          DATA.email ? row('Email', DATA.email) : null,
          row('Membership', DATA.type),
          DATA.lc ? row('Local committee', DATA.lc) : null,
          row(exempt ? 'Fee' : 'Amount paid', DATA.amount + ' IQD', 'amount'),
          row(exempt ? 'Recorded by' : 'Paid to', DATA.delegate),
          row('Date', DATA.paidDate),
          row('Receipt No', DATA.receiptNo)),
        card(el('label', { className: 'confirm' }, agree,
          el('span', { textContent: exempt
            ? `I confirm my membership is exempted from the fee (0 IQD), as recorded by ${DATA.delegate}.`
            : `I confirm I paid ${DATA.amount} IQD to ${DATA.delegate}.` }))),
        padCard(pad, 'Your signature'),
        err,
        btn,
        el('p', { className: 'muted center', textContent: 'If any detail is wrong, do not sign. Contact your delegate.' })
      );
      pad.reset();

      btn.onclick = () => {
        err.textContent = '';
        if (!agree.checked) { err.textContent = 'Please tick the box to confirm the payment.'; return; }
        if (pad.isEmpty()) { err.textContent = 'Please sign in the box first.'; return; }
        busy(btn, true, 'Making your receipt… please wait');
        rpc('member', { token: DATA.token, signature: pad.toDataURL(), agreed: true },
          res => {
            if (res && res.ok) return renderDone(res.receiptUrl);
            err.textContent = (res && res.error) || 'Something went wrong. Please try again.';
            busy(btn, false, 'Sign & get my receipt');
          },
          () => {
            err.textContent = 'Connection problem. Check your internet and try again.';
            busy(btn, false, 'Sign & get my receipt');
          });
      };
    }

    function renderDelegate() {
      subtitle('Delegate signature setup');
      const pad = makePad();
      const err = el('div', { className: 'error' });
      const btn = el('button', { className: 'btn btn-primary', textContent: 'Save my signature' });

      show(
        card(
          el('h2', { textContent: 'Hello ' + DATA.name + ' 👋' }),
          el('p', { className: 'muted', textContent: 'Draw your signature below. It will be printed on every receipt for payments you collect.' }),
          DATA.hasSignature ? el('p', { className: 'muted', textContent: 'You already saved a signature. Saving again replaces it for future receipts.' }) : null),
        padCard(pad, 'Your signature'),
        err,
        btn
      );
      pad.reset();

      btn.onclick = () => {
        err.textContent = '';
        if (pad.isEmpty()) { err.textContent = 'Please sign in the box first.'; return; }
        busy(btn, true, 'Saving…');
        rpc('delegate', { token: DATA.token, signature: pad.toDataURL() },
          res => {
            if (res && res.ok) return renderMessage('✅ Signature saved', 'Thank you! You can now tick "Paid" in the Tracker for members who pay you.');
            err.textContent = (res && res.error) || 'Something went wrong. Please try again.';
            busy(btn, false, 'Save my signature');
          },
          () => {
            err.textContent = 'Connection problem. Check your internet and try again.';
            busy(btn, false, 'Save my signature');
          });
      };
    }

    function busy(btn, on, text) {
      btn.disabled = on;
      btn.textContent = text;
    }

    const pages = {
      member: renderMember,
      delegate: renderDelegate,
      done: () => renderDone(DATA.receiptUrl),
      message: () => renderMessage(DATA.title, DATA.text),
    };
    function start() {
      document.getElementById('org').textContent = DATA.org || 'IFMSA-Kurdistan';
      (pages[DATA.mode] || (() => renderMessage('Error', 'Unknown page.')))();
    }

    // ---- talking to the server ----
    // On Google's own page google.script.run does it. On the hosted page the same Google backend answers plain web
    // requests instead: GET ?api=load reads the details and a POST saves the signature (no cookies are sent, so
    // being signed in to several Google accounts cannot get in the way).
    let BACKEND = '';
    function rpc(action, payload, onOk, onFail) {
      if (window.google && google.script && google.script.run) {
        const run = google.script.run.withSuccessHandler(onOk).withFailureHandler(onFail);
        if (action === 'member') run.submitMemberSignature(payload.token, payload.signature, payload.agreed === true);
        else run.submitDelegateSignature(payload.token, payload.signature);
        return;
      }
      fetch(BACKEND, { method: 'POST', body: JSON.stringify(Object.assign({ action }, payload)) })
        .then(r => r.json()).then(onOk).catch(onFail);
    }

    function notice(title, text) { return { mode: 'message', org: 'IFMSA-Kurdistan', title, text }; }

    if (DATA) {
      start();
    } else {
      // Hosted page. The link looks like ?lc=duhok&t=<token> (member) or ?lc=duhok&d=<token> (delegate), and only the
      // backends listed in window.HOSTED (written when the page is built) are ever contacted.
      const q = new URLSearchParams(location.search);
      const base = ((window.HOSTED && HOSTED.backends) || {})[(q.get('lc') || '').toLowerCase()];
      const kind = q.get('t') ? 't' : (q.get('d') ? 'd' : '');
      if (!base || !kind) {
        DATA = notice('Link not complete', 'Please open the exact link you were sent.');
        start();
      } else {
        BACKEND = base;
        subtitle('Membership');
        show(card(el('p', { className: 'muted', style: 'margin:0;font-size:15px', textContent: 'Loading…' })));
        fetch(base + '?api=load&' + kind + '=' + encodeURIComponent(q.get(kind)))
          .then(r => r.json())
          .then(d => { DATA = d; start(); })
          .catch(() => { DATA = notice('Could not connect', 'Check your internet connection and open the link again.'); start(); });
      }
    }
  </script>
</body>
</html>
